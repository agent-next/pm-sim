name: Preflight secret
description: Fail the job when a required secret is empty
inputs:
  name:
    description: Variable name used in log messages
    required: true
  secret:
    description: Secret value to check (pass ${{ secrets.X }})
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VALUE: ${{ inputs.secret }}
        VAR_NAME: ${{ inputs.name }}
      run: |
        if [ -z "$VALUE" ]; then
          echo "${VAR_NAME} is empty" >&2
          exit 1
        fi
        echo "${VAR_NAME} is set"
