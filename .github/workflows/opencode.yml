name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

concurrency:
  group: opencode-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public Q&A / triage / review: fast FreeInference pool.
  # Implement uses OPENCODE_IMPLEMENT_MODEL (slow pool, 1 in-flight per key).
  OPENCODE_MODEL: freeinference/qwen3.6-35b
  OPENCODE_IMPLEMENT_MODEL: freeinference/deepseek-v4-flash

jobs:
  comment:
    if: |
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment') &&
      !startsWith(github.event.comment.body, '/oc implement')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight FreeInference key
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_PUBLIC_KEY }}
        run: |
          if [ -z "$FREEINFERENCE_API_KEY" ]; then
            echo "FREEINFERENCE_API_KEY is empty" >&2
            exit 1
          fi
          echo "FREEINFERENCE_API_KEY is set"
      - uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d # v1.18.18
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          mentions: "/opencode,/oc"
          use_github_token: true
          share: false
          prompt: |
            This is agent-next/polymarket-paper-trader, a PAPER trading simulator.
            There is no wallet and no real money. Never invent fills, prices, or P&L.
            Never print secrets or .env values.

            On /oc or /opencode:
            - Answer, explain, or review from the repo and thread.
            - Do not push commits. Implementation is a different job (/oc implement).
            - Prefer citing tests/ and pm_trader/ over speculation.

  triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight FreeInference key
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_PUBLIC_KEY }}
        run: |
          if [ -z "$FREEINFERENCE_API_KEY" ]; then
            echo "FREEINFERENCE_API_KEY is empty" >&2
            exit 1
          fi
          echo "FREEINFERENCE_API_KEY is set"
      - uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d # v1.18.18
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          use_github_token: true
          share: false
          prompt: |
            Triage this new issue on a paper-trading simulator.
            Label if you can (bug, enhancement, documentation).
            Ask for missing repro details. Do not write code or push.
            Do not add bot:implement unless a human already asked for an implementation.

  implement:
    if: |
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'bot:implement') ||
      ((github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment') &&
       startsWith(github.event.comment.body, '/oc implement'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Gate to trusted actors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) echo "actor ${ACTOR} has ${perm}; implement allowed" ;;
            *) echo "actor ${ACTOR} lacks write access (${perm}); refusing implement" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight FreeInference key
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
        run: |
          if [ -z "$FREEINFERENCE_API_KEY" ]; then
            echo "FREEINFERENCE_API_KEY is empty" >&2
            exit 1
          fi
          echo "FREEINFERENCE_API_KEY is set"
      - uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d # v1.18.18
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ env.OPENCODE_IMPLEMENT_MODEL }}
          mentions: "/oc implement"
          use_github_token: true
          share: false
          prompt: |
            Implement the requested change on this paper-trading simulator.
            There is no wallet and no real money. Never invent fills or P&L.
            Never print secrets.

            - Create or update a branch and open a PR. Do not merge.
            - Prefer tests first. Cite tests/ and pm_trader/.
            - Do not approve the PR. Do not add merge-ready yourself.
      - name: Dispatch Tests after GITHUB_TOKEN push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = "HEAD" ] || [ "$branch" = "main" ]; then
            branch=$(gh pr list --repo "$REPO" --state open --json headRefName,author,updatedAt \
              --jq '[.[] | select(.author.login=="github-actions[bot]")] | sort_by(.updatedAt) | reverse | .[0].headRefName // empty')
          fi
          if [ -z "$branch" ]; then
            echo "no implement branch; skip Tests dispatch"
            exit 0
          fi
          echo "Dispatching Tests on ${branch}"
          gh workflow run Tests --repo "$REPO" --ref "$branch"

  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight FreeInference key
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_PUBLIC_KEY }}
        run: |
          if [ -z "$FREEINFERENCE_API_KEY" ]; then
            echo "FREEINFERENCE_API_KEY is empty" >&2
            exit 1
          fi
          echo "FREEINFERENCE_API_KEY is set"
      - uses: anomalyco/opencode/github@31406ccc51b4bd2a4e1e086b2bcaa5f7f804f26d # v1.18.18
        env:
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          use_github_token: true
          share: false
          prompt: |
            Shallow review only. Report discrete defects this diff introduces.
            Ignore style nits and speculation. If nothing actionable, do not post LGTM.
            Do not push commits. Do not approve. Do not merge.

  merge-ready:
    if: |
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Reconcile merge-ready label with Tests result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.state == "open" and .head.sha == env.SHA)][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR with head $SHA (none or stale); nothing to reconcile"
            exit 0
          fi
          echo "PR #$pr sha=$SHA conclusion=$CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            if gh pr view "$pr" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx merge-ready; then
              gh pr edit "$pr" --repo "$REPO" --remove-label merge-ready
              echo "Tests ${CONCLUSION}; removed merge-ready from PR #$pr"
            else
              echo "Tests ${CONCLUSION}; merge-ready not set on PR #$pr"
            fi
            exit 0
          fi
          if gh pr view "$pr" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx merge-ready; then
            echo "merge-ready already set on PR #$pr"
            exit 0
          fi
          context_gone=0
          not_green=0
          for ctx in "Python 3.10" "Python 3.11" "Python 3.12" "Python 3.13"; do
            state=$(CTX="$ctx" gh api "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[]? | select(.name == env.CTX)] | last
                    | if . == null then "absent" elif .conclusion == null then "pending" else .conclusion end')
            # legacy statuses API fallback when the context is not a check-run
            if [ "$state" = "absent" ]; then
              state=$(CTX="$ctx" gh api "repos/${REPO}/commits/${SHA}/status" \
                --jq '[.statuses[]? | select(.context == env.CTX)] | last
                      | if . == null then "absent" else .state end')
            fi
            echo "check $ctx -> $state"
            case "$state" in
              success) ;;
              absent) context_gone=1 ;;
              *) not_green=1 ;;
            esac
          done
          if [ "$context_gone" -ne 0 ]; then
            echo "Required check context missing entirely for $SHA (Tests matrix renamed?); failing loud" >&2
            exit 1
          fi
          if [ "$not_green" -ne 0 ]; then
            echo "Required Python 3.10–3.13 checks are not all success; skip merge-ready"
            exit 0
          fi
          head_now=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$head_now" != "$SHA" ]; then
            echo "PR #$pr head moved to ${head_now} before labeling; aborting"
            exit 0
          fi
          gh label create merge-ready --repo "$REPO" --force --color 0E8A16 --description "CI green; human may merge" || true
          gh pr edit "$pr" --repo "$REPO" --add-label merge-ready
          gh pr comment "$pr" --repo "$REPO" --body "merge-ready: Python 3.10–3.13 are green on \`${SHA}\`. A human (not this job) may merge. This job does not merge."
